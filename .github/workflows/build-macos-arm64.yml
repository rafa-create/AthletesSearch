name: build-macos-arm64

# Node 24 sur les runners (remplace l’ancien runtime Node 20 des actions JS).
# Voir https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# - Chaque push sur main → build + Release GitHub avec un tag auto (v0.0.<run_number>), sans tag manuel.
# - Push d'un tag v* (ex. v1.2.0) → build + Release sur ce tag (version “officielle”).
# - Déclenchement manuel possible.
on:
  push:
    branches:
      - main
      # Branche de dev courante du dépôt (adapter si besoin)
      - v01.00.00
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Déterminer le tag de release
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "name=Athletes Searcher ${TAG} (macOS arm64)" >> "$GITHUB_OUTPUT"
          else
            TAG="v0.0.${GITHUB_RUN_NUMBER}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "name=Athletes Searcher ${TAG} — build auto (main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: Build .app (PyInstaller)
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --name "Athletes Searcher" \
            --add-data "app/exemple:sportifs_exemple" \
            --add-data "app/MiseAJour_macOS_Et_Relance.sh:." \
            --add-data "app/update_ui.py:." \
            app/app.py

      - name: Zip .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Athletes Searcher.app" "../AthletesSearcher-macOS-arm64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: AthletesSearcher-macOS-arm64.zip
          generate_release_notes: true
          prerelease: false
