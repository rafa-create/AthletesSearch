name: build-macos-arm64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    env:
      # GitHub recommendation for upcoming Node 20 deprecation in JS actions.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: Build .app (PyInstaller)
        run: |
          pyinstaller \
            --noconfirm \
            --windowed \
            --name "Athletes Searcher" \
            --add-data "app/exemple:sportifs_exemple" \
            --add-data "app/MiseAJour_macOS_Et_Relance.sh:." \
            --add-data "app/update_ui.py:." \
            app/app.py

      - name: Zip .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Athletes Searcher.app" "../AthletesSearcher-macOS-arm64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AthletesSearcher-macOS-arm64.zip
          generate_release_notes: true

